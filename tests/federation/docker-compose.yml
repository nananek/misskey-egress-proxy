# SPDX-License-Identifier: AGPL-3.0-only
#
# Base stack: instance A, the system under test. A real Misskey backend on
# a UDS, fronted by this repo's misskey-egress-proxy exactly as in
# production. On its own this brings up nothing to federate *with* — pick a
# peer overlay too, e.g.:
#
#   docker compose -f docker-compose.yml -f docker-compose.misskey.yml up --build
#
# or just use ./run.sh <peer>. See README.md for what each peer proves and
# why the split.
#
# Nothing here is published on the host. `certs/gen-certs.sh` generates a
# real (if throwaway) CA so peers that properly validate TLS can trust it.
# Misskey doesn't use it: its outbound HTTP client (undici) doesn't honor
# NODE_EXTRA_CA_CERTS, so Misskey containers instead get
# NODE_TLS_REJECT_UNAUTHORIZED=0 and skip certificate validation entirely.
# Fine here because the whole stack is an isolated, throwaway compose
# network — NEVER carry NODE_TLS_REJECT_UNAUTHORIZED=0 into a real
# deployment.

services:
  postgres-a:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: misskey
      POSTGRES_USER: misskey
      POSTGRES_PASSWORD: testpass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U misskey"]
      interval: 3s
      retries: 30

  redis-a:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 30

  # Named volumes start out root-owned; the official image runs as the
  # unprivileged `misskey` user (uid/gid 991), which can't create its
  # socket in a root-owned directory. One-shot chown before Misskey starts.
  misskey-a-socket-init:
    image: busybox
    command: chown 991:991 /run/misskey
    volumes:
      - misskey-a-socket:/run/misskey

  misskey-app-a:
    image: misskey/misskey:latest
    environment:
      NODE_TLS_REJECT_UNAUTHORIZED: "0" # test-only, see header comment
    volumes:
      - ./config/misskey-a.yml:/misskey/.config/default.yml:ro
      - misskey-a-socket:/run/misskey
    depends_on:
      postgres-a:
        condition: service_healthy
      redis-a:
        condition: service_healthy
      misskey-a-socket-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-Sfso/dev/null",
          "--unix-socket",
          "/run/misskey/misskey.sock",
          "http://localhost/healthz",
        ]
      interval: 5s
      timeout: 5s
      retries: 60

  misskey-egress-proxy-a:
    build:
      context: ../..
    environment:
      LISTEN_ADDR: "0.0.0.0:8080"
      MISSKEY_SOCKET: /run/misskey/misskey.sock
      # Not exercised by any scenario script (no caller in this compose
      # actually lives under this suffix) — the unit tests in
      # tests/router.rs cover the redirect behavior directly. Kept here so
      # the container matches how it's really configured in production.
      INTERNAL_BASE_URL: "http://internal-a.invalid"
      INTERNAL_REFERER_SUFFIX: ".internal-a.invalid"
    volumes:
      - misskey-a-socket:/run/misskey:ro
    depends_on:
      misskey-app-a:
        condition: service_healthy

  # nginx named literally `misskey-a` so it resolves as `url: https://misskey-a/`
  # (Misskey's own config) via compose's built-in per-service DNS — no extra
  # network aliasing needed.
  misskey-a:
    image: nginx:alpine
    volumes:
      - ./nginx/misskey-a.conf:/etc/nginx/nginx.conf:ro
      - certs:/certs:ro
    depends_on:
      misskey-egress-proxy-a:
        condition: service_started
      certs:
        condition: service_completed_successfully

  # Overridden per peer (CERT_DOMAINS needs the peer's own hostname added).
  certs:
    image: alpine:3.21
    command: sh -c "apk add --no-cache openssl >/dev/null && /gen-certs.sh"
    environment:
      CERT_DOMAINS: "misskey-a"
    volumes:
      - certs:/certs
      - ./certs/gen-certs.sh:/gen-certs.sh:ro

  # Bootstraps instance A (admin account + enable federation) regardless of
  # which peer is under test. `seed-a` gets a read-only mount of instance
  # A's UDS directly: admin/setup operations (`/api/*`) are only ever
  # reachable over the "internal" path (here, the raw socket; in
  # production, Tailscale + the internal Caddy), never through the public
  # egress proxy — which is exactly the property this project exists to
  # enforce, so seeding A's admin account has to go around the proxy the
  # same way a real internal operator would.
  seed-a:
    image: alpine:3.21
    command: sh -c "apk add --no-cache curl jq >/dev/null && /seed-a.sh"
    volumes:
      - ./lib.sh:/lib.sh:ro
      - ./seed-a.sh:/seed-a.sh:ro
      - tokens:/tokens
      - misskey-a-socket:/run/misskey-a:ro
    depends_on:
      misskey-app-a:
        condition: service_healthy

volumes:
  certs:
  tokens:
  misskey-a-socket:
