#
# Peer overlay: instance B, a second real Misskey acting as a plain remote
# federation peer (fronted by a bare TLS terminator, not by the proxy under
# test). Use with the base compose file:
#
#   docker compose -f docker-compose.yml -f docker-compose.misskey.yml up --build
#
# or ./run.sh misskey.

services:
  certs:
    environment:
      CERT_DOMAINS: "misskey-a,misskey-b"

  postgres-b:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: misskey
      POSTGRES_USER: misskey
      POSTGRES_PASSWORD: testpass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U misskey"]
      interval: 3s
      retries: 30

  redis-b:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 30

  misskey-app-b:
    image: misskey/misskey:latest
    environment:
      NODE_TLS_REJECT_UNAUTHORIZED: "0" # test-only, see base compose header
    volumes:
      - ./misskey/misskey-b.yml:/misskey/.config/default.yml:ro
    depends_on:
      postgres-b:
        condition: service_healthy
      redis-b:
        condition: service_healthy
    # Uses the image's own built-in healthcheck (curls :3000/healthz using
    # the `port:` value from default.yml), since B listens on a TCP port.

  misskey-b:
    image: nginx:alpine
    volumes:
      - ./misskey/nginx-b.conf:/etc/nginx/nginx.conf:ro
      - certs:/certs:ro
    depends_on:
      misskey-app-b:
        condition: service_healthy
      certs:
        condition: service_completed_successfully

  seed-b:
    image: alpine:3.21
    command: sh -c "apk add --no-cache curl jq >/dev/null && /seed-b.sh"
    volumes:
      - ./lib.sh:/lib.sh:ro
      - ./misskey/seed-b.sh:/seed-b.sh:ro
      - tokens:/tokens
    depends_on:
      misskey-b:
        condition: service_started

  scenario:
    image: alpine:3.21
    command: sh -c "apk add --no-cache curl jq >/dev/null && /scenario.sh"
    volumes:
      - ./lib.sh:/lib.sh:ro
      - ./check-a-gate.sh:/check-a-gate.sh:ro
      - ./misskey/scenario.sh:/scenario.sh:ro
      - misskey-a-socket:/run/misskey-a:ro
      - tokens:/tokens
    depends_on:
      seed-a:
        condition: service_completed_successfully
      seed-b:
        condition: service_completed_successfully
