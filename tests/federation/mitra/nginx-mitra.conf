#
# TLS-terminating front door for the Mitra peer, the plain remote peer.
# Goes straight to Mitra — Mitra is not the system under test.
events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=5s;

    server {
        listen 443 ssl;
        server_name _;
        client_max_body_size 10M;

        ssl_certificate /certs/mitra.crt;
        ssl_certificate_key /certs/mitra.key;

        location / {
            set $upstream mitra-app;
            proxy_pass http://$upstream:8383;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
