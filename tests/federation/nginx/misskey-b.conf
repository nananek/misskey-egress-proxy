#
# TLS-terminating front door for instance B, the plain remote peer. Goes
# straight to Misskey — B is not the system under test.
events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=5s;

    server {
        listen 443 ssl;
        server_name _;
        client_max_body_size 10M;

        ssl_certificate /certs/misskey-b.crt;
        ssl_certificate_key /certs/misskey-b.key;

        location / {
            set $upstream misskey-app-b;
            proxy_pass http://$upstream:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
