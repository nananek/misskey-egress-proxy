#
# TLS-terminating front door for instance A. Everything behind this is the
# system under test: this forwards to misskey-egress-proxy-a, never
# straight to Misskey, so the allowlist actually gets exercised.
events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=5s;

    server {
        listen 443 ssl;
        server_name _;
        client_max_body_size 10M;

        ssl_certificate /certs/misskey-a.crt;
        ssl_certificate_key /certs/misskey-a.key;

        location / {
            set $upstream misskey-egress-proxy-a;
            proxy_pass http://$upstream:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
