name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:
  schedule:
    # Catches drift against misskey/misskey:latest and fjox/mitra:latest
    # themselves (routes this proxy relies on moving, disappearing, or
    # changing shape), not just changes to this repo.
    - cron: "0 20 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: cargo fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  federation-misskey:
    name: federation test (real Misskey x2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: ./tests/federation/run.sh misskey

  federation-mitra:
    name: federation test (Misskey + real Mitra)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: ./tests/federation/run.sh mitra

  # Only on an actual push to main (never PRs, schedule, or manual
  # dispatch), and only after every test above has passed — this registry
  # image is meant to be pulled and run as-is, so it should never lag
  # behind or contradict what CI verified.
  publish:
    name: publish image to GHCR
    runs-on: ubuntu-latest
    needs: [test, federation-misskey, federation-mitra]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          docker buildx build \
            --push \
            -t "ghcr.io/${{ github.repository }}:latest" \
            -t "ghcr.io/${{ github.repository }}:sha-${{ github.sha }}" \
            .
